<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4252"/>
      <stop offset="1" stop-color="#2E3440"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#88C0D0"/>
      <stop offset="0.5" stop-color="#81A1C1"/>
      <stop offset="1"   stop-color="#5E81AC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="none" stroke="#4C566A" stroke-width="2"/>

  <!-- back screen: the original (muted) -->
  <g filter="url(#shadow)">
    <rect x="52" y="58" width="118" height="82" rx="12" fill="#434C5E" stroke="#4C566A" stroke-width="3"/>
    <rect x="62" y="68" width="98" height="62" rx="6" fill="#3B4252"/>
  </g>

  <!-- front screen: the replica (bright, aurora wallpaper) -->
  <g filter="url(#shadow)">
    <rect x="86" y="96" width="118" height="82" rx="12" fill="#2E3440" stroke="#88C0D0" stroke-width="3"/>
    <rect x="96" y="106" width="98" height="62" rx="6" fill="url(#aurora)"/>
    <!-- window/panel hint on the replica -->
    <rect x="96" y="106" width="98" height="14" rx="6" fill="#ECEFF4" opacity="0.85"/>
    <circle cx="106" cy="113" r="3" fill="#BF616A"/>
    <circle cx="116" cy="113" r="3" fill="#EBCB8B"/>
    <circle cx="126" cy="113" r="3" fill="#A3BE8C"/>
    <!-- stand -->
    <rect x="138" y="178" width="14" height="12" fill="#4C566A"/>
    <rect x="120" y="190" width="50" height="7" rx="3.5" fill="#4C566A"/>
  </g>

  <!-- replicate arrow: original -> replica -->
  <path d="M 150 78 A 40 40 0 0 1 176 120" fill="none" stroke="#ECEFF4" stroke-width="7" stroke-linecap="round"/>
  <path d="M 176 120 l -11 -3 l 8 -9 z" fill="#ECEFF4"/>
</svg>
